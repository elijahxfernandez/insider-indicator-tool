services:
  - type: web
    name: ownership-indicator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker is required: the backend and refresh queue are process-local.
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MASSIVE_API_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DATA_DIR
        value: .runtime
